context:
  version: 1.5.0
  python_min: 3.10

package:
  name: glaes
  version: ${{ version }}

source:
  path: .

build:
  script: ${{ PYTHON }} -m pip install -e . --no-deps
  noarch: python
  number: 0

requirements:
  host:
  - python ${{ python_min }}.*
  - setuptools >=64.0
  - pip
  run:
  - python >=${{ python_min }}
  - pip
  - ipykernel
  - matplotlib
  - geokit =1.5.0
  - pandas <=2.3.2
  - numpy
  - scipy <1.15
  - pytest
  - pytest-xdist
  - pytest-cov
  - ruff =0.14.1
  - nbval



