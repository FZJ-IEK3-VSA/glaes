name: Check code formatting and Linter hints

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["dev"]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: "--version"
          version: "0.13.1"
      - name: Check Linter
        run: ruff check --output-format=github --config=ruff.toml fine

      - name: Check Format

        run: ruff format --diff --config ruff.toml
