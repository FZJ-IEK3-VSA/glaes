on:
  workflow_dispatch:
  push:
    branches: ["**"]

jobs:
  TestPushCondaForgeDev:
    name: Test conda-forge development version on ${{ matrix.runner_tag }}
    strategy:
      fail-fast: false
      matrix:
        runner_tag: ["self-hosted"]
    # geokit is installed from conda-forge via requirements.yml (no source checkout).
    uses: FZJ-IEK3-VSA/.github/.github/workflows/run_conda_forge_test.yml@v1
    secrets: inherit
    with:
      runner_tag: ${{ matrix.runner_tag }}
      requirements_file_name: requirements.yml
      multiprocessing_pytest_string: "-n auto"
      # Collect coverage and upload to Codecov (requires the CODECOV_TOKEN secret).
      coverage: true
      coverage_package_name: glaes
      ipynb_example_folder: "Examples"
      multiprocessing_example_string: "-n 2"
