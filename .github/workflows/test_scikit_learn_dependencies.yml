name: Test scikit-learn versions for glaes 1.3.0
on: 
  workflow_dispatch:
    inputs:
      tags:
        description: 'Manual run' 
  push:
    branches: 
      - version/1.3.0

  # Allows to trigger the workflow manually
    
jobs:
    TestGeokitForGdalVersions:
        name: scikit_learn_version=${{ matrix.scikit_learn_version }},${{ matrix.os }}
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                # https://docs.github.com/en/actions/how-tos/writing-workflows/choosing-what-your-workflow-does/running-variations-of-jobs-in-a-workflow
                # Min
                # os: ["ubuntu-24.04"]
                # Proper
                # os: ["ubuntu-22.04", "macos-13","windows-2025","windows-2022","macos-14"]
                # os: ["ubuntu-24.04","ubuntu-22.04", "macos-13","windows-2025","windows-2022"]                
                os: ["self-hosted"]
                # Proper Gdal Versions
                scikit_learn_version: ['0.20.3', '0.21.1', '0.21.2', '0.21.3', '0.22', '0.22.1', '0.22.2.post1', '0.23.0', '0.23.1', '0.23.2', '0.24.0', '0.24.1', '0.24.2', '1.0', '1.0.1', '1.0.2', '1.1.0', '1.1.1', '1.1.2', '1.1.3', '1.2.0', '1.2.1', '1.2.2', '1.3.0', '1.3.1', '1.3.2', '1.4.0', '1.4.1.post1', '1.4.2', '1.5.0', '1.5.1', '1.5.2', '1.6.0', '1.6.1', '1.7.0', '1.7.1', '1.7.2']
                # Failing Versions 
                # scikit_learn_version: ["2.4.3","2.4.4","3.3.2","3.3.3",]
        steps:
            - name: Setup Conda
              uses: conda-incubator/setup-miniconda@v3
              with:
                miniforge-version: latest
                channels: conda-forge,nodefaults
                activate-environment: test_env
                conda-remove-defaults: "true"  
            - name: Checkout
              uses: actions/checkout@v4        
            - name: Update values.yaml
              uses: fjogeleit/yaml-update-action@main
              with:
                valueFile: 'requirements-dev.yml'
                commitChange: false
                method: CreateOrUpdate
                changes: |
                  {
                  "dependencies[14]": "scikit-learn =${{ matrix.scikit_learn_version }}"
                  }
            - name: Install libraries
              shell: pwsh
              id: install-step
              run: |
                    ls
                    echo "LS Done"
                    mamba env create --file=requirements-dev.yml -c conda-forge -c nodefaults -n test_env 
                    mamba run -n test_env python pip install -e . --no-deps
                    echo "Installation done"
                    mamba list -n test_env
                    echo "libraries printed" 
            - name: Run pytest
              shell: pwsh
              run: |
                    echo "Start ls"
                    ls
                    echo "ls terminated"
                    echo "start pytest"
                    mamba run -n test_env python -m pytest -vv
                    echo "Pytest done"