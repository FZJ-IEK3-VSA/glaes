name: glaes_env
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python
  - pip
  - ipykernel
  - matplotlib
  - descartes
  - pandas <=2.3.2
  - numpy
  - scipy <1.15
  - scikit-learn
  - geokit >=1.7.1 # should be installed from the extra repo, not conda-forge
  - pytest
  - pytest-xdist
  - pytest-cov
  - ruff =0.14.1
  - nbval