name: glaes_env
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python >=3.10.0,<=3.13.9
  - pip
  - jupyter
  - matplotlib
  - pandas <=2.3.2
  - numpy
  - scipy <1.15
  - geokit >=1.7.1,<=1.9.0 # should be installed from the extra repo, not conda-forge
  - pytest
  - pytest-xdist
  - pytest-cov
  - ruff =0.14.1
  - nbval